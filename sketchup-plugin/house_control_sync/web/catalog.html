<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Objetos y Materiales - House Control (Estilo Lumion)</title>
  <link rel="stylesheet" href="catalog.css">
</head>
<body>
  <div class="lumion-app">
    <!-- BARRA SUPERIOR LUMION (HEADER) -->
    <header class="lumion-header">
      <div class="brand">
        <div class="brand-badge">
          <svg viewBox="0 0 24 24" class="brand-icon">
            <path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">LUMION 3D LIBRARY</span>
          <span class="brand-subtitle">HOUSE CONTROL SYNC • SKETCHUP</span>
        </div>
      </div>

      <!-- BUSCADOR EN TIEMPO REAL -->
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar muebles, luces, climas, autos, materiales..." autocomplete="off">
        <button id="clear-search" class="clear-btn" title="Limpiar búsqueda">&times;</button>
      </div>

      <!-- OPCIONES RÁPIDAS (HABITACIÓN Y MODO CONTINUO) -->
      <div class="header-controls">
        <div class="control-group">
          <label for="room-select">Habitación:</label>
          <select id="room-select">
            <option value="living" selected>🛋️ Salón (Living)</option>
            <option value="bedroom">🛏️ Dormitorio</option>
            <option value="kitchen">🍳 Cocina</option>
            <option value="bathroom">🛁 Baño</option>
            <option value="office">💼 Oficina / Estudio</option>
            <option value="terrace">🌿 Terraza / Exterior</option>
            <option value="garage">🚗 Garaje</option>
          </select>
        </div>

        <label class="toggle-control" title="Permite hacer clic repetido en SketchUp para colocar múltiples copias">
          <input type="checkbox" id="continuous-placement">
          <span class="toggle-slider"></span>
          <span class="toggle-label">Colocación Múltiple</span>
        </label>
      </div>
    </header>

    <!-- CUERPO PRINCIPAL CON SIDEBAR DE CATEGORÍAS Y CONTENIDO -->
    <div class="lumion-body">
      <!-- SIDEBAR DE CATEGORÍAS ESTILO LUMION -->
      <nav class="lumion-sidebar">
        <button class="cat-tab active" data-category="furniture">
          <div class="cat-icon-wrap">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 10V7A2 2 0 0 0 18 5H6A2 2 0 0 0 4 7V10A2 2 0 0 0 2 12V17H3.5L4 19H5.5L6 17H18L18.5 19H20L20.5 17H22V12A2 2 0 0 0 20 10M6 7H18V10H6V7M20 15H4V12H20V15Z"/></svg>
          </div>
          <span class="cat-name">Mobiliario</span>
          <span class="cat-badge">10</span>
        </button>

        <button class="cat-tab" data-category="bedroom">
          <div class="cat-icon-wrap">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 7H11V14H3V5H1V20H3V17H21V20H23V11A4 4 0 0 0 19 7M7 13A3 3 0 0 0 10 10A3 3 0 0 0 7 7A3 3 0 0 0 4 10A3 3 0 0 0 7 13Z"/></svg>
          </div>
          <span class="cat-name">Dormitorio</span>
          <span class="cat-badge">6</span>
        </button>

        <button class="cat-tab" data-category="lighting">
          <div class="cat-icon-wrap">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2A7 7 0 0 0 5 9C5 11.38 6.19 13.47 8 14.74V17A1 1 0 0 0 9 18H15A1 1 0 0 0 16 17V14.74C17.81 13.47 19 11.38 19 9A7 7 0 0 0 12 2M9 21A1 1 0 0 0 10 22H14A1 1 0 0 0 15 21V20H9V21Z"/></svg>
          </div>
          <span class="cat-name">Iluminación</span>
          <span class="cat-badge">7</span>
        </button>

        <button class="cat-tab" data-category="kitchen">
          <div class="cat-icon-wrap">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V4C20 2.9 19.1 2 18 2M18 4V9H6V4H18M6 20V11H18V20H6M8 5H10V8H8V5M8 13H10V17H8V13Z"/></svg>
          </div>
          <span class="cat-name">Cocina</span>
          <span class="cat-badge">4</span>
        </button>

        <button class="cat-tab" data-category="bathroom">
          <div class="cat-icon-wrap">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 13V4H18V13H15L15 4H13V13H10L10 4H8V13H4C2.9 13 2 13.9 2 15V19C2 20.1 2.9 21 4 21H20C21.1 21 22 20.1 22 19V15C22 13.9 21.1 13 20 13M4 19V15H20V19H4Z"/></svg>
          </div>
          <span class="cat-name">Baño & WC</span>
          <span class="cat-badge">4</span>
        </button>

        <button class="cat-tab" data-category="nature">
          <div class="cat-icon-wrap">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3C6.5 3 2 6.5 2 12C2 14.5 3 16.7 4.7 18.3L3 20H8.3C9.4 20.6 10.7 21 12 21C17.5 21 22 16.5 22 11C22 5.5 17.5 3 12 3M12 19C10.7 19 9.5 18.6 8.5 18H12V16H7.3C6.5 15 6 13.6 6 12C6 8.7 8.7 6 12 6C15.3 6 18 8.7 18 12C18 15.3 15.3 19 12 19Z"/></svg>
          </div>
          <span class="cat-name">Plantas</span>
          <span class="cat-badge">3</span>
        </button>

        <button class="cat-tab" data-category="clima">
          <div class="cat-icon-wrap">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2M12 4A8 8 0 0 1 20 12A8 8 0 0 1 12 20A8 8 0 0 1 4 12A8 8 0 0 1 12 4M11 6V11.26A3.5 3.5 0 0 0 9 14.5A3.5 3.5 0 0 0 12.5 18A3.5 3.5 0 0 0 16 14.5A3.5 3.5 0 0 0 14 11.26V6Z"/></svg>
          </div>
          <span class="cat-name">Climatización</span>
          <span class="cat-badge">3</span>
        </button>

        <button class="cat-tab" data-category="vehicles">
          <div class="cat-icon-wrap">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5H6.5C5.84 5 5.28 5.42 5.08 6.01L3 12V20C3 20.55 3.45 21 4 21H5C5.55 21 6 20.55 6 20V19H18V20C18 20.55 18.45 21 19 21H20C20.55 21 21 20.55 21 20V12L18.92 6.01M6.85 7H17.14L18.22 10H5.78L6.85 7M6.5 16C5.67 16 5 15.33 5 14.5C5 13.67 5.67 13 6.5 13C7.33 13 8 13.67 8 14.5C8 15.33 7.33 16 6.5 16M17.5 16C16.67 16 16 15.33 16 14.5C16 13.67 16.67 13 17.5 13C18.33 13 19 13.67 19 14.5C19 15.33 18.33 16 17.5 16Z"/></svg>
          </div>
          <span class="cat-name">Vehículos</span>
          <span class="cat-badge">2</span>
        </button>

        <div class="sidebar-divider"></div>

        <!-- PESTAÑA ESPECIAL CATÁLOGO DE MATERIALES -->
        <button class="cat-tab cat-materials" data-category="materials">
          <div class="cat-icon-wrap">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3C7 3 3 7 3 12C3 17 7 21 12 21C12.55 21 13 20.55 13 20C13 19.74 12.9 19.5 12.74 19.33C12.57 19.14 12.47 18.88 12.47 18.6C12.47 18.05 12.92 17.6 13.47 17.6H15.5C18.54 17.6 21 15.14 21 12.1C21 7.07 16.97 3 12 3M6.5 12C5.67 12 5 11.33 5 10.5C5 9.67 5.67 9 6.5 9C7.33 9 8 9.67 8 10.5C8 11.33 7.33 12 6.5 12M9.5 8C8.67 8 8 7.33 8 6.5C8 5.67 8.67 5 9.5 5C10.33 5 11 5.67 11 6.5C11 7.33 10.33 8 9.5 8M14.5 8C13.67 8 13 7.33 13 6.5C13 5.67 13.67 5 14.5 5C15.33 5 16 5.67 16 6.5C16 7.33 15.33 8 14.5 8M17.5 12C16.67 12 16 11.33 16 10.5C16 9.67 16.67 9 17.5 9C18.33 9 19 9.67 19 10.5C19 11.33 18.33 12 17.5 12Z"/></svg>
          </div>
          <span class="cat-name">Materiales</span>
          <span class="cat-badge highlight">30</span>
        </button>
      </nav>

      <!-- ÁREA DE CONTENIDO Y GRID -->
      <main class="lumion-content">
        <!-- BARRA DE SUBFILTROS / CHIPS -->
        <div class="subfilter-bar" id="subfilter-bar">
          <button class="chip active" data-sub="all">Todos los elementos</button>
        </div>

        <!-- RECUENTO Y ESTADO -->
        <div class="content-status">
          <span id="items-count-label">Mostrando 10 elementos</span>
          <div class="help-hint">
            <svg viewBox="0 0 24 24" class="hint-icon"><path fill="currentColor" d="M11 9H13V7H11M12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20M12 2A10 10 0 0 0 2 12A10 10 0 0 0 12 22A10 10 0 0 0 22 12A10 10 0 0 0 12 2M11 17H13V11H11V17Z"/></svg>
            <span>Haz clic en <strong>"Colocar"</strong> para insertar interactivamente en la vista 3D de SketchUp</span>
          </div>
        </div>

        <!-- GRID DE TARJETAS (OBJETOS O MATERIALES) -->
        <div class="cards-grid" id="cards-grid">
          <!-- Las tarjetas se generan dinámicamente con JS -->
        </div>
      </main>
    </div>

    <!-- MODAL / DRAWER DE PERSONALIZACIÓN DE DIMENSIONES Y COLOR -->
    <div class="modal-overlay" id="custom-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title">Personalizar Objeto</h3>
          <button class="modal-close" id="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="param-row">
            <label for="param-name">Nombre:</label>
            <input type="text" id="param-name">
          </div>
          <div class="param-grid-3">
            <div class="param-field">
              <label for="param-w">Ancho (X):</label>
              <div class="unit-input"><input type="number" id="param-w" step="0.05" min="0.1"><span>m</span></div>
            </div>
            <div class="param-field">
              <label for="param-d">Profundidad (Y):</label>
              <div class="unit-input"><input type="number" id="param-d" step="0.05" min="0.1"><span>m</span></div>
            </div>
            <div class="param-field">
              <label for="param-h">Altura (Z):</label>
              <div class="unit-input"><input type="number" id="param-h" step="0.05" min="0.05"><span>m</span></div>
            </div>
          </div>
          <div class="param-row">
            <label for="param-color">Color / Tono de Acabado:</label>
            <div class="color-picker-wrapper">
              <input type="color" id="param-color" value="#8B93A7">
              <span id="param-color-hex">#8B93A7</span>
            </div>
          </div>
          <div class="param-row">
            <label for="param-tuya">Dispositivo Tuya / Smart Life (Opcional):</label>
            <input type="text" id="param-tuya" placeholder="Ej: switch_luz_1, termostato_sala">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" id="modal-cancel-btn">Cancelar</button>
          <button class="btn-primary" id="modal-place-btn">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
            Colocar en Modelo
          </button>
        </div>
      </div>
    </div>

    <!-- TOAST NOTIFICACIÓN FLOTANTE -->
    <div class="lumion-toast" id="lumion-toast">
      <span class="toast-icon">✓</span>
      <span class="toast-message">Objeto listo para colocar</span>
    </div>
  </div>

  <script src="catalog.js"></script>
</body>
</html>
